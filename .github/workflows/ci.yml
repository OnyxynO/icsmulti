name: CI — Build & Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # Deux toolchains : 26.3 = plancher (cible de déploiement macOS 26.3),
    # 27.2 = Xcode utilisé en local (image `xcode-27` encore en preview chez GitHub)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            xcode: "26.3"
          - runner: xcode-27
            xcode: "27.2"
    name: Xcode ${{ matrix.xcode }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Sélectionner Xcode ${{ matrix.xcode }}
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer

      - name: Build
        run: |
          xcodebuild build \
            -project ICSMulti/ICSMulti.xcodeproj \
            -scheme ICSMulti \
            -destination 'platform=macOS' \
            -quiet

      - name: Tests unitaires
        run: |
          xcodebuild test \
            -project ICSMulti/ICSMulti.xcodeproj \
            -scheme ICSMulti \
            -destination 'platform=macOS' \
            -quiet
